[package]
name = "webserver"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
reqwest = "0.13.2"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
mongodb = "3.2.0"
serde = { version = "1.0.228", features = ["derive"] }
axum-jwt = "0.1.3"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto"] }
chrono = "0.4.44"
simple_crypt = "0.2.3"
base64 = "0.22.1"
