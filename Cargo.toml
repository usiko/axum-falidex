[package]
name = "webserver"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["multipart"] }
reqwest = { version = "0.13.2", features = ["json", "multipart", "form"] }
tokio = { version = "1.50.0", features = ["full", "macros", "rt-multi-thread"] }
mongodb = "3.2.0"
serde = { version = "1.0.228", features = ["derive"] }
axum-jwt = "0.1.3"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto"] }
chrono = "0.4.44"
simple_crypt = "0.2.3"
base64 = "0.22.1"
tower-http = { version = "0.6.8", features = ["cors"] }
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
uuid = "1.23.0"
serde_json = "1.0.149"
futures = "0.3.32"
cloudinary = "0.8.2"
